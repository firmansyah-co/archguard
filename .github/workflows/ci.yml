name: ArchGuard CI & Standards Gate

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test-suite:
    name: Pytest Unit & Integration Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system ".[dev]"

      - name: Run Pytest Test Suite
        run: |
          pytest --cov=src/archguard --cov-report=term-missing tests/

  self-governance-audit:
    name: ArchGuard Self-Audit Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Package
        run: |
          pip install uv
          uv pip install --system .

      - name: Run ArchGuard Self Audit
        run: |
          archguard check --all
