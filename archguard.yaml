version: '1.0'
project_name: archguard
project_type: library
tokens:
  enabled: false
  token_files:
  - frontend/src/styles/tokens.css
  - frontend/src/styles/global.css
  - src/styles/tokens.css
  - src/styles/global.css
  scan_paths:
  - frontend/src
  - src/components
  - src/pages
  allowed_hex_colors: []
layers:
  enabled: false
  backend_root: backend/src
  layers:
  - api
  - service
  - repository
  - models
  - core
  forbidden_dependencies:
    api:
    - repository
    - sqlalchemy
    - sqlmodel
    - psycopg
    models:
    - api
    - service
    - repository
    service:
    - api
    repository:
    - api
components:
  enabled: false
  pages_dirs:
  - frontend/src/pages
  - src/pages
  common_components_dirs:
  - frontend/src/components/common
  - src/components/common
  forbidden_raw_primitives:
  - button
  - input
  - select
  - textarea
  - table
  - dialog
specs:
  enabled: true
  specs_dir: specs
  require_contracts: true
  require_traceability: true
  require_tasks_sync: true
topology:
  enabled: true
  forbidden_root_extensions:
  - .sh
  - .js
  - .ts
  - .tmp
  - .bak
  allowed_root_files:
  - pyproject.toml
  - README.md
  - LICENSE
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md
  - .gitignore
  - archguard.yaml
  require_adr_dir: true
  adr_dir: docs/adr
integrity:
  enabled: true
  production_paths:
  - src
  test_paths:
  - tests
  ban_unanchored_synthetic_literals: true
  ban_heuristic_state_inference: true
  ban_synthetic_fallbacks: true
  ban_mock_artifacts_in_production: true
git_topology:
  enabled: true
  topology_type: single-trunk
  required_branches:
    - name: main
      protected: true
      require_pr: true
      require_approvals: 0
      require_ci_pass: true
  branch_naming_patterns:
    feature: "^feat/[a-z0-9-]+$"
    bugfix: "^fix/[a-z0-9-]+$"
    refactor: "^refactor/[a-z0-9-]+$"
    chore: "^chore/[a-z0-9-]+$"
    ci: "^ci/[a-z0-9-]+$"
    docs: "^docs/[a-z0-9-]+$"
  ephemeral_branch_max_age_hours: 48
git_versioning:
  enabled: true
  version_scheme: pep440
  version_files:
    - path: pyproject.toml
      pattern: 'version\s*=\s*"([^"]+)"'
    - path: src/*/__init__.py
      pattern: '__version__\s*=\s*"([^"]+)"'
  commit_types:
    major:
      - "feat!"
    minor:
      - "feat"
    patch:
      - "fix"
      - "perf"
      - "refactor"
  ban_manual_version_edits: true
  tag_prefix: "v"
  dev_prerelease_identifier: "alpha"
