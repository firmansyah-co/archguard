version: '1.0'
project_name: archguard
project_type: library
tokens:
  enabled: false
  token_files:
  - frontend/src/styles/tokens.css
  - frontend/src/styles/global.css
  - src/styles/tokens.css
  - src/styles/global.css
  scan_paths:
  - frontend/src
  - src/components
  - src/pages
  allowed_hex_colors: []
layers:
  enabled: false
  backend_root: backend/src
  layers:
  - api
  - service
  - repository
  - models
  - core
  forbidden_dependencies:
    api:
    - repository
    - sqlalchemy
    - sqlmodel
    - psycopg
    models:
    - api
    - service
    - repository
    service:
    - api
    repository:
    - api
components:
  enabled: false
  pages_dirs:
  - frontend/src/pages
  - src/pages
  common_components_dirs:
  - frontend/src/components/common
  - src/components/common
  forbidden_raw_primitives:
  - button
  - input
  - select
  - textarea
  - table
  - dialog
specs:
  enabled: true
  specs_dir: specs
  require_contracts: true
  require_traceability: true
  require_tasks_sync: true
topology:
  enabled: true
  forbidden_root_extensions:
  - .sh
  - .js
  - .ts
  - .tmp
  - .bak
  allowed_root_files:
  - pyproject.toml
  - README.md
  - LICENSE
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md
  - .gitignore
  - archguard.yaml
  require_adr_dir: true
  adr_dir: docs/adr
integrity:
  enabled: true
  production_paths:
  - src
  test_paths:
  - tests
  ban_unanchored_synthetic_literals: true
  ban_heuristic_state_inference: true
  ban_synthetic_fallbacks: true
  ban_mock_artifacts_in_production: true
